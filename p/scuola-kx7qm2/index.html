<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista materiale scolastico</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4EFE6">
<style>
  :root{
    --paper:#F4EFE6; --paper-2:#EBE4D6; --card:#FFFcf7; --ink:#2A261F; --ink-soft:#6E6558;
    --line:#E2D8C8; --check:#3F6B45; --accent:#B5542C; --bought:#3D5A6C; --bought-bg:#E7EEF2;
    --shadow:0 10px 30px rgba(42,38,31,.06);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:radial-gradient(1200px 500px at 10% -10%, #fff8ee 0%, transparent 55%), var(--paper); color:var(--ink); font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif; padding:24px 16px 80px; -webkit-tap-highlight-color:transparent;}
  .wrap{max-width:520px;margin:0 auto}
  .kicker{font-family:-apple-system,system-ui,sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;}
  h1{font-size:1.72rem;margin:0 0 6px;font-weight:600;letter-spacing:-.02em;line-height:1.15;}
  .sub{color:var(--ink-soft);font-size:.92rem;font-family:-apple-system,system-ui,sans-serif;line-height:1.45;}
  .progress-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:16px 0 22px;box-shadow:var(--shadow);}
  .progress-row{display:flex;align-items:center;gap:12px;font-family:-apple-system,system-ui,sans-serif;}
  .progress-track{flex:1;height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#4A7A50,#3F6B45);border-radius:99px;transition:width .35s ease;}
  .progress-count{font-size:.85rem;color:var(--ink-soft);min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}
  .sync{margin-top:8px;font-family:-apple-system,system-ui,sans-serif;font-size:.72rem;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;}
  .sync b{color:var(--check);font-weight:650}
  .tabs{display:flex;gap:8px;margin-bottom:16px;font-family:-apple-system,system-ui,sans-serif;}
  .tab{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:999px;padding:10px 8px;font-size:.82rem;font-weight:650;cursor:pointer;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .section{margin-bottom:22px}
  .section-title{font-family:-apple-system,system-ui,sans-serif;font-size:.73rem;color:var(--accent);font-weight:700;letter-spacing:.08em;margin:0 0 8px 4px;}
  .bought .section-title{color:var(--bought)}
  ul{list-style:none;margin:0;padding:0}
  .item{display:flex;align-items:flex-start;gap:12px;padding:13px 12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;cursor:pointer;user-select:none;box-shadow:var(--shadow);}
  .item.done{background:var(--bought-bg);border-color:#d5e0e6;}
  .box{flex-shrink:0;width:24px;height:24px;border-radius:8px;border:1.6px solid var(--ink-soft);margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .box svg{width:13px;height:13px;opacity:0}
  .item.done .box{background:var(--check);border-color:var(--check)}
  .item.done .box svg{opacity:1}
  .label{font-size:1.02rem;line-height:1.35;padding-top:1px}
  .note{font-family:-apple-system,system-ui,sans-serif;font-size:.76rem;color:var(--ink-soft);margin-top:3px;}
  .empty{font-family:-apple-system,system-ui,sans-serif;color:var(--ink-soft);font-size:.9rem;padding:18px 8px;text-align:center;}
  .reset-row{text-align:center;margin-top:28px}
  .reset-btn{font-family:-apple-system,system-ui,sans-serif;font-size:.82rem;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:20px;padding:8px 16px;cursor:pointer;}
  .saved-badge{font-family:-apple-system,system-ui,sans-serif;font-size:.72rem;color:var(--check);text-align:center;height:16px;margin-top:8px;opacity:0;transition:opacity .3s ease;}
  .saved-badge.show{opacity:1}
  .hint{margin-top:18px;font-family:-apple-system,system-ui,sans-serif;font-size:.78rem;color:var(--ink-soft);text-align:center;line-height:1.45;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Privato · non indicizzato</div>
    <h1>Materiale scolastico</h1>
    <div class="sub">Tocca una voce per spostarla. Un altro tocco la riporta indietro.</div>
    <div class="progress-card">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
        <div class="progress-count" id="count">0/0</div>
      </div>
      <div class="sync"><span>Salvataggio sul telefono</span><b id="syncState"></b></div>
    </div>
  </header>
  <div class="tabs">
    <button class="tab active" id="tabTodo" type="button">Da comprare <span id="nTodo">0</span></button>
    <button class="tab" id="tabDone" type="button">Già acquistato <span id="nDone">0</span></button>
  </div>
  <div id="listTodo"></div>
  <div id="listDone" class="bought" hidden></div>
  <div class="reset-row">
    <button class="reset-btn" id="resetBtn" type="button">Ricomincia da capo</button>
    <div class="saved-badge" id="savedBadge">Salvato ✓</div>
  </div>
  <p class="hint">Stesso link per entrambi. I flag restano su questo telefono e questo browser.</p>
</div>
<script>
const DATA = [
  { title: "Quaderni per materia", items: [
    { t: "Quaderno mezzo centimetro (con o senza margine)" },
    { t: "Matematica — copertina verde scuro" },
    { t: "Scienze — copertina gialla" },
    { t: "Geometria — copertina verde chiaro" },
    { t: "Geografia, con margine — copertina viola" },
    { t: "Arte, senza margine — copertina trasparente" },
    { t: "Italiano: quaderno riga di seconda (testi) — copertina blu" },
    { t: "Italiano: quaderno grammatica — copertina blu" }
  ]},
  { title: "Carta e cancelleria", items: [
    { t: "1 risma di carta" },
    { t: "1 album A4 liscio" },
    { t: "Penne cancellabili gel: rossa, blu, verde" },
    { t: "Matita HB" },
    { t: "Colori a matita" },
    { t: "Righello 15 cm" },
    { t: "Colla" },
    { t: "Gomma bianca" },
    { t: "Forbici" }
  ]},
  { title: "Altro", items: [
    { t: "Primo dizionario", n: "Come da foto / indicazione" },
    { t: "Astuccio grande" },
    { t: "Astuccio piccolo" },
    { t: "Etichette con nome e cognome (anche per i libri)" }
  ]}
];
const STORAGE_KEY = "scuola-checklist-2026";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
let view = "todo";
let state = {};
function flattenIds(){ const ids=[]; DATA.forEach((sec,si)=>sec.items.forEach((_,ii)=>ids.push(si+'-'+ii))); return ids; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function loadState(){
  try{ if (window.storage && window.storage.get){ const res = await window.storage.get(STORAGE_KEY, false); if (res && res.value) return JSON.parse(res.value); } }catch(e){}
  try{ const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); }catch(e){}
  return {};
}
async function saveState(next){
  state = next;
  const payload = JSON.stringify(state);
  try{ localStorage.setItem(STORAGE_KEY, payload); }catch(e){}
  try{ if (window.storage && window.storage.set) await window.storage.set(STORAGE_KEY, payload, false); }catch(e){}
  const badge = document.getElementById('savedBadge');
  badge.classList.add('show');
  setTimeout(function(){ badge.classList.remove('show'); }, 900);
}
function render(){
  const todoRoot = document.getElementById('listTodo');
  const doneRoot = document.getElementById('listDone');
  todoRoot.innerHTML = ''; doneRoot.innerHTML = '';
  let todoN = 0, doneN = 0;
  DATA.forEach(function(sec, si){
    const todoItems = []; const doneItems = [];
    sec.items.forEach(function(item, ii){
      const id = si + '-' + ii;
      if (state[id]) { doneItems.push({item:item,id:id}); doneN++; }
      else { todoItems.push({item:item,id:id}); todoN++; }
    });
    if (todoItems.length) todoRoot.appendChild(sectionEl(sec.title, todoItems, false));
    if (doneItems.length) doneRoot.appendChild(sectionEl(sec.title, doneItems, true));
  });
  if (!todoN) todoRoot.innerHTML = '<div class="empty">Tutto comprato. Bravi.</div>';
  if (!doneN) doneRoot.innerHTML = '<div class="empty">Ancora niente in questa lista. Tocca un articolo quando l\u2019hai preso.</div>';
  document.getElementById('nTodo').textContent = todoN;
  document.getElementById('nDone').textContent = doneN;
  const total = todoN + doneN;
  const pct = total ? Math.round((doneN / total) * 100) : 0;
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('count').textContent = doneN + '/' + total;
  document.getElementById('syncState').textContent = (doneN === total && total) ? 'Completata' : '';
}
function sectionEl(title, rows, done){
  const sec = document.createElement('div'); sec.className = 'section';
  const h = document.createElement('div'); h.className = 'section-title'; h.textContent = title.toUpperCase(); sec.appendChild(h);
  const ul = document.createElement('ul');
  rows.forEach(function(row){
    const li = document.createElement('li');
    li.className = 'item' + (done ? ' done' : '');
    li.innerHTML = '<div class="box">' + CHECK + '</div><div><div class="label">' + escapeHtml(row.item.t) + '</div>' + (row.item.n ? '<div class="note">' + escapeHtml(row.item.n) + '</div>' : '') + '</div>';
    li.addEventListener('click', function(){ toggle(row.id); });
    ul.appendChild(li);
  });
  sec.appendChild(ul); return sec;
}
async function toggle(id){
  const next = Object.assign({}, state);
  next[id] = !next[id];
  await saveState(next);
  render();
}
function setView(next){
  view = next;
  document.getElementById('tabTodo').classList.toggle('active', view === 'todo');
  document.getElementById('tabDone').classList.toggle('active', view === 'done');
  document.getElementById('listTodo').hidden = view !== 'todo';
  document.getElementById('listDone').hidden = view !== 'done';
}
async function init(){
  state = await loadState();
  render();
  document.getElementById('tabTodo').addEventListener('click', function(){ setView('todo'); });
  document.getElementById('tabDone').addEventListener('click', function(){ setView('done'); });
  document.getElementById('resetBtn').addEventListener('click', async function(){
    if (!confirm('Togliere tutti i flag e ripartire da zero?')) return;
    const cleared = {}; flattenIds().forEach(function(id){ cleared[id] = false; });
    await saveState(cleared); setView('todo'); render();
  });
}
init();
</script>
</body>
</html>
