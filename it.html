.ns-language-switcher{
  display:inline-flex;

  border:1px solid rgba(255,255,255,.16);
  border-radius:999px;
  background:rgba(10,10,12,.68);

}
.ns-language-switcher a{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:30px;

  text-decoration:none;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  opacity:.68;
  transition:.2s ease;
}
.ns-language-switcher a:hover,
.ns-language-switcher a:focus-visible{
  opacity:1;
  background:rgba(255,255,255,.10);
}
.ns-language-switcher a.active{
  opacity:1;
  color:#0a0a0c;
  background:#f0b85a;
}
html[dir="rtl"] body{
  direction:rtl;
  text-align:right;
}
html[dir="rtl"] .nav,
html[dir="rtl"] .nav__actions,
html[dir="rtl"] .ns-language-switcher{
  direction:rtl;
}
@media(max-width:900px){
  .ns-language-switcher{
    order:-1;
    margin-right:0;
    margin-left:4px;
  }
  .ns-language-switcher a{
