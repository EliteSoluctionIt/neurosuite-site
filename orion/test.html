<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Orion · Test Scientific Foundations</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#0f1622;--line:#243044;--text:#eef3fa;--muted:#9aabbf;--accent:#5aa7ff;--ok:#2ecf7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#12345a44,transparent 40%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}
header{padding:18px 20px;border-bottom:1px solid var(--line);background:#070b12cc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
header strong{font-size:15px}
header span{color:var(--muted);font-size:12px;margin-left:10px}
main{max-width:860px;margin:0 auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,button,textarea{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid #33475f;background:#0a1019;color:var(--text)}
input,textarea{flex:1;min-width:220px}
button{cursor:pointer;font-weight:700;border:0;background:linear-gradient(135deg,#55b1ff,#477cff);color:#fff;white-space:nowrap}
button.ghost{background:#172233;border:1px solid #33475f}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid #33475f;background:#121b29;color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--accent)}
.msg{white-space:pre-wrap;line-height:1.6}
.ref{border-left:3px solid var(--accent);padding:10px 12px;margin:10px 0;background:#0b121d;border-radius:0 10px 10px 0}
.ref b{color:var(--text)}
.meta{color:var(--muted);font-size:12px}
.status{color:var(--ok);font-size:12px;margin-top:8px}
.err{color:#ff6b78}
</style>
</head>
<body>
<header>
  <strong>Orion · Test Scientific Foundations</strong>
  <span>Knowledge base v2.0 · solo uso interno</span>
</header>
<main>
  <section class="panel">
    <div class="row">
      <input id="q" placeholder="Es. Su che basi usiamo l'EEG portatile a secco?" />
      <button id="ask">Chiedi a Orion</button>
      <button id="reload" class="ghost">Ricarica KB</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="status" id="status">Caricamento knowledge base…</div>
  </section>
  <section class="panel">
    <div id="out" class="msg meta">Fai una domanda. Orion risponderà solo con riferimenti dal corpus scientifico installato.</div>
  </section>
</main>
<script>
const SUGGESTIONS = [
  "Su che basi scientifiche usiamo l'EEG portatile a secco?",
  "Quali studi supportano il cammino come marker longitudinale di rischio?",
  "Dammi i riferimenti sul linguaggio come segnale osservativo",
  "Cosa dice la letteratura su QEEG e spettro cognitivo nel Parkinson?",
  "Quali paper supportano i sensori wearable e ambientali nelle residenze?",
  "Quali evidenze ci sono su resting-state EEG e traiettorie cognitive?"
];

let KB = null;

const $ = id => document.getElementById(id);

function renderChips(){
  $("chips").innerHTML = SUGGESTIONS.map(s => `<button class="chip" type="button">${s}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(btn => {
    btn.onclick = () => { $("q").value = btn.textContent; ask(); };
  });
}

async function loadKB(){
  $("status").textContent = "Caricamento knowledge base…";
  try {
    const res = await fetch("./scientific-foundations.json?ts=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);
    KB = await res.json();
    const n = (KB.areas||[]).reduce((a,x)=>a+(x.references?x.references.length:0),0);
    $("status").textContent = `KB attiva · v${KB.version} · ${KB.areas.length} aree · ${n} riferimenti`;
  } catch(e){
    $("status").innerHTML = `<span class="err">Errore caricamento KB: ${e.message}. Verifica path orion/scientific-foundations.json</span>`;
  }
}

function score(text, area){
  const t = text.toLowerCase();
  let s = 0;
  const bag = (area.id + " " + area.name + " " + (area.core_claim||"") + " " + (area.references||[]).map(r=>r.citation+" "+r.finding+" "+r.relevance).join(" ")).toLowerCase();
  const keys = t.split(/[^a-zàèéìòóù0-9]+/i).filter(w=>w.length>3);
  keys.forEach(k => { if(bag.includes(k)) s += 2; });
  if(/eeg|elettrod|dry|portatil/.test(t) && area.id==="EEG") s += 8;
  if(/resting|alzheimer|mci|alpha|theta|cognitive traject/.test(t) && area.id==="RS") s += 8;
  if(/parkinson|qeeg|spettro cognit/.test(t) && area.id==="PD") s += 8;
  if(/linguagg|speech|voce|vocal/.test(t) && area.id==="SP") s += 8;
  if(/cammino|gait|andatur/.test(t) && area.id==="GT") s += 8;
  if(/sensor|wearable|ambient|cadut|fall|residenz/.test(t) && area.id==="SN") s += 8;
  if(/multimodal|baseline|architettur/.test(t) && area.id==="MM") s += 6;
  return s;
}

function answer(question){
  if(!KB) return "Knowledge base non caricata.";
  const ranked = (KB.areas||[]).map(a => ({a, s: score(question,a)})).sort((x,y)=>y.s-x.s);
  const top = ranked.filter(x => x.s > 0).slice(0,2);
  if(!top.length){
    return "Non ho trovato un'area strettamente collegata a questa domanda nel corpus attuale.\nProva una delle domande suggerite o riformula sul dominio EEG / gait / speech / sensori / QEEG / resting-state.";
  }
  let out = "";
  top.forEach(({a}, idx) => {
    out += (idx? "\n\n" : "") + `Area: ${a.name}\n${a.core_claim||""}\n\nRiferimenti rilevanti:`;
    const refs = (a.references||[]).slice(0,6);
    refs.forEach(r => {
      out += `\n\n• ${r.citation} (${r.year})\n  ${r.finding}\n  → ${r.relevance}`;
    });
    if(a.supporting_clusters){
      out += "\n\nCluster di supporto:\n- " + a.supporting_clusters.join("\n- ");
    }
  });
  out += "\n\nNota operativa: questi riferimenti costituiscono contesto scientifico della linea osservativa. Non equivalgono a validazione clinica di NeuroSuite.";
  return out;
}

function ask(){
  const q = $("q").value.trim();
  if(!q){ $("out").textContent = "Inserisci una domanda."; return; }
  $("out").textContent = answer(q);
}

$("ask").onclick = ask;
$("q").addEventListener("keydown", e => { if(e.key==="Enter") ask(); });
$("reload").onclick = loadKB;

renderChips();
loadKB();
</script>
</body>
</html>
