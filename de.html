<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Human Lines — Wartung</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f8fcfb" />
  <style>
    :root {
      --bg: #f8fcfb;
      --fg: #0a1f1c;
      --muted: #5a6b68;
      --accent: #0d6e6e;
      --line: rgba(10, 31, 28, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #f8fcfb 0%, #e8f4f2 50%, #f0f7f5 100%);
      color: var(--fg);
      text-align: center;
      padding: 2rem;
      line-height: 1.5;
    }
    .mark {
      width: 48px;
      height: 48px;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="11" cy="11" r="9" stroke="currentColor" stroke-width="1"/>
    <circle cx="11" cy="11" r="3" fill="currentColor"/>
    <circle cx="11" cy="2" r="1.4" fill="currentColor"/>
    <circle cx="20" cy="11" r="1.4" fill="currentColor"/>
    <circle cx="11" cy="20" r="1.4" fill="currentColor"/>
    <circle cx="2" cy="11" r="1.4" fill="currentColor"/>
  </svg>
  <div class="badge"><span class="dot"></span> Wartung</div>
  <h1>Wir sind gleich wieder da</h1>
  <p>
    Human Lines / NeuroSuite ist vorübergehend offline wegen geplanter Wartung.<br/>
    Wir stellen den Dienst so schnell wie möglich wieder her.
  </p>
  <p style="font-size:0.95rem; margin-top:-0.5rem;">
    Für Informationen: <a href="mailto:info@neurosuite.net">info@neurosuite.net</a>
  </p>
  <footer>© 2026 Human Lines</footer>
</body>
</html>
