name: Deploy NeuroSuite site to Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!.github/workflows/deploy_cloudflare_pages.yml'
      - '.github/workflows/deploy_cloudflare_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=neurosuite-webplaza --branch=production
