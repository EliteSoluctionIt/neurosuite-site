<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0d131d">
  <link rel="manifest" href="/control-center/manifest.webmanifest">
  <title>NeuroSuite Control Center</title>

  <style>
    :root{
      color-scheme:dark;
      --bg:#05080d;
      --panel:#0d131d;
      --line:#263346;
      --text:#f5f8fc;
      --muted:#aeb9c8;
      --blue:#56a8ff;
      --green:#24bd68;
      --red:#ed4b59;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 10%,#12345a55,transparent 32%),
        var(--bg);
      font-family:Inter,system-ui,sans-serif;
      color:var(--text);
    }

    header{
      padding:18px;
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      background:#05080de8;
      backdrop-filter:blur(12px);
    }

    main{
      max-width:850px;
      margin:auto;
      padding:18px;
    }

    .panel,.card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px;
      margin:14px 0;
    }

    h1,h2{margin-top:6px}

    p,.meta{color:var(--muted);line-height:1.5}

    input,button{
      width:100%;
      border-radius:12px;
      padding:13px;
      font:inherit;
    }

    input{
      background:#050a11;
      color:white;
      border:1px solid #34465f;
      margin:8px 0 14px;
    }

    button{
      border:0;
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    .primary{background:linear-gradient(135deg,#55b1ff,#477cff)}
    .approve{background:var(--green)}
    .reject{background:var(--red)}
    .secondary{background:#1a2636;border:1px solid #34465f}

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .row button{
      flex:1;
      min-width:130px;
    }

    .hidden{display:none}

    .badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      background:#192638;
      font-size:.8rem;
      font-weight:800;
    }

    code{
      display:block;
      padding:12px;
      background:#050a11;
      border-radius:10px;
      overflow-wrap:anywhere;
    }
  </style>
</head>

<body>
<header>
  <strong>NeuroSuite Control Center</strong>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h1>Accesso amministratore</h1>
    <p>Inserisci il token privato configurato su Cloudflare.</p>

    <input id="adminToken" type="password" placeholder="Admin token">

    <button id="loginButton" class="primary">
      Accedi
    </button>

    <p id="loginStatus"></p>
  </section>

  <section id="appPanel" class="hidden">
    <div class="panel">
      <h1>Richieste investitori</h1>

      <div class="row">
        <button id="refreshButton" class="secondary">Aggiorna</button>
        <button id="installButton" class="secondary">Installa app</button>
        <button id="logoutButton" class="secondary">Esci</button>
      </div>
    </div>

    <div id="requests"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let deferredPrompt = null;

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/control-center/sw.js");
}

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  deferredPrompt = event;
});

$("installButton").onclick = async () => {
  if (!deferredPrompt) {
    alert("Apri il menu del browser e scegli Aggiungi a schermata Home.");
    return;
  }

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
};

function token() {
  return sessionStorage.getItem("ns_admin_token") || "";
}

function headers() {
  return {
    "Authorization": "Bearer " + token(),
    "Content-Type": "application/json"
  };
}

function escapeHtml(value = "") {
  return String(value).replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[character]);
}

async function loadRequests() {
  const response = await fetch("/api/admin/requests", {
    headers: headers()
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Accesso negato");
  }

  renderRequests(data.requests || []);
}

function renderRequests(items) {
  const root = $("requests");

  if (!items.length) {
    root.innerHTML =
      '<div class="panel"><p>Nessuna richiesta presente.</p></div>';
    return;
  }

  root.innerHTML = items.map(item => `
    <article class="card">
      <span class="badge">${escapeHtml(item.status)}</span>

      <h2>${escapeHtml(item.name)}</h2>

      <p class="meta">
        ${escapeHtml(item.role || "")}
        ${item.company ? " · " + escapeHtml(item.company) : ""}
      </p>

      <p><strong>${escapeHtml(item.email)}</strong></p>

      <p>
        <strong>Motivo:</strong>
        ${escapeHtml(item.reason)}
      </p>

      ${item.details
        ? `<p>${escapeHtml(item.details)}</p>`
        : ""
      }

      <p class="meta">
        ${escapeHtml(item.country || "")}
        ·
        ${new Date(item.createdAt).toLocaleString("it-IT")}
      </p>

      ${item.status === "pending" ? `
        <div class="row">
          <button
            class="approve"
            onclick="decide('${item.id}','approve')">
            Approva
          </button>

          <button
            class="reject"
            onclick="decide('${item.id}','reject')">
            Rifiuta
          </button>
        </div>
      ` : ""}

      ${item.generatedPassword
        ? `<p><strong>Password:</strong></p>
           <code>${escapeHtml(item.generatedPassword)}</code>`
        : ""
      }
    </article>
  `).join("");
}

async function decide(id, action) {
  const note = prompt(
    action === "approve"
      ? "Nota facoltativa:"
      : "Motivo facoltativo del rifiuto:"
  ) || "";

  const response = await fetch(
    "/api/admin/request/" + encodeURIComponent(id),
    {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({action, note})
    }
  );

  const data = await response.json();

  if (!response.ok) {
    alert(data.error || "Operazione fallita");
    return;
  }

  if (data.password) {
    alert("Password personale generata: " + data.password);
  }

  await loadRequests();
}

$("loginButton").onclick = async () => {
  sessionStorage.setItem(
    "ns_admin_token",
    $("adminToken").value.trim()
  );

  try {
    await loadRequests();
    $("loginPanel").classList.add("hidden");
    $("appPanel").classList.remove("hidden");
  } catch (error) {
    sessionStorage.removeItem("ns_admin_token");
    $("loginStatus").textContent = error.message;
  }
};

$("refreshButton").onclick = loadRequests;

$("logoutButton").onclick = () => {
  sessionStorage.clear();
  location.reload();
};

if (token()) {
  loadRequests()
    .then(() => {
      $("loginPanel").classList.add("hidden");
      $("appPanel").classList.remove("hidden");
    })
    .catch(() => {
      sessionStorage.removeItem("ns_admin_token");
    });
}
</script>
</body>
</html>
